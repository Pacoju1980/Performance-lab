<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f5f7fb" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Performance Lab" />
  <meta name="description" content="Panel personal de salud, recuperación y entrenamiento." />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./icon-180.png" />
  <link rel="stylesheet" href="./styles.css?v=1.0.7" />
  <title>Performance Lab</title>
</head>
<body>
  <div id="app"></div>
  <script>
    // Limpieza temprana de builds PWA anteriores.
    if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister())).catch(()=>{});
    if ('caches' in window) caches.keys().then(ks => ks.filter(k => k.startsWith('performance-lab-')).forEach(k => caches.delete(k))).catch(()=>{});
  </script>
  <script type="module" src="./app.js?v=1.0.7"></script>
</body>
</html>
